---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Renovate

# Self-hosted, replacing the Renovate GitHub App for this repo: only a
# self-hosted run can execute postUpgradeTasks (.renovaterc.json5), which
# runs `nix run .#refresh-nix-hash` right after a fetchFromGitHub rev bump
# to recompute its paired hash — something the hosted App has no way to do.
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-last-accessed: P7D
          purge-primary-key: never

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Run Renovate
        # renovate: datasource=npm depName=renovate
        run: npx --yes renovate@44.97.2
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_IGNORE_PR_AUTHOR: "true"
          RENOVATE_ALLOWED_COMMANDS: '["^nix run \\.#refresh-nix-hash -- [\\w./-]+ [\\w./-]+ [\\w.-]+$"]'
