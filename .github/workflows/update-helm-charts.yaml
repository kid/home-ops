---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Update Helm Charts

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write
  actions: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      charts: ${{ steps.set-matrix.outputs.charts }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: List pinned charts
        id: set-matrix
        run: |
          charts=$(find charts -mindepth 3 -maxdepth 3 -name default.nix \
            | sed -E 's#^charts/([^/]+)/([^/]+)/default\.nix$#\1/\2#' \
            | jq -R -s -c 'split("\n") | map(select(length > 0)) | sort')
          echo "charts=$charts" >> "$GITHUB_OUTPUT"

  update:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        chart: ${{ fromJson(needs.discover.outputs.charts) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: |
            extra-substituters = https://nixhelm.cachix.org
            extra-trusted-public-keys = nixhelm.cachix.org-1:esqauAsR4opRF0UsGrA6H3gD21OrzMnBBYvJXeddjtY=

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-last-accessed: P7D
          purge-primary-key: never

      - name: Bump chart version and hash
        run: nix develop --command helmupdater update "${{ matrix.chart }}"

      - name: Regenerate manifests
        run: nix run .#write-manifests -- --skip-secrets

      - name: Open pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          commit-message: "chore(charts): bump ${{ matrix.chart }}"
          title: "chore(charts): bump ${{ matrix.chart }}"
          branch: update-helm-chart/${{ matrix.chart }}
          sign-commits: true
          add-paths: |
            charts/
            manifests/
