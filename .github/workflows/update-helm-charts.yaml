---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Update Helm Charts

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - name: Bump pinned chart versions and hashes
        run: nix develop --command helmupdater update-all

      - name: Regenerate manifests
        run: nix run .#write-manifests -- --skip-secrets

      - name: Open pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          commit-message: "chore(charts): bump pinned helm chart versions"
          title: "chore(charts): bump pinned helm chart versions"
          branch: update-helm-charts
          sign-commits: true
          add-paths: |
            charts/
            manifests/
