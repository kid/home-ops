---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Nix Flake Check

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  checks:
    # The in-cluster runner (modules/kubernetes/actions-runner-controller),
    # building on the node's Nix daemon: never for pull requests from forks.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: home-ops
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run nix flake check
        run: nix flake check --print-build-logs

      # What the PR changes in k3s-prd-0's packages against its deployed
      # system, as one PR comment updated on every run. The check already
      # built the toplevel in the host's store. Report only: never fails
      # the required check.
      - name: Diff k3s-prd-0's closure
        continue-on-error: true
        run: |
          old=$(readlink -f /nix/var/nix/profiles/system)
          new=$(nix build --no-link --print-out-paths .#nixosConfigurations.k3s-prd-0.config.system.build.toplevel)
          # diff-closures colors its sizes even off a terminal, and they reached
          # the comment as caret text ("^[[31;1m"): strip both forms.
          diff=$(nix store diff-closures "$old" "$new" | sed -e 's/\x1b\[[0-9;]*m//g' -e 's/\^\[\[[0-9;]*m//g')
          {
            echo '<!-- closure-diff:k3s-prd-0 -->'
            echo '### k3s-prd-0 closure diff'
            echo
            if [ "$old" = "$new" ]; then
              echo 'No change: this PR builds the deployed system.'
            elif [ -z "$diff" ]; then
              echo 'No package version or size change: configuration only.'
            else
              # "name: old → new[, size]" lines become table rows; the
              # size-only ones go in a collapsed list.
              versions=$(printf '%s\n' "$diff" | awk '/→/ {
                name = $0; sub(/: .*/, "", name)
                rest = $0; sub(/^[^:]*: /, "", rest)
                n = split(rest, part, ", ")
                printf "| %s | %s | %s |\n", name, part[1], (n > 1 ? part[2] : "")
              }')
              sizes=$(printf '%s\n' "$diff" | grep -v '→' || true)
              if [ -n "$versions" ]; then
                echo '| Package | Version | Size |'
                echo '| --- | --- | --- |'
                printf '%s\n' "$versions"
                echo
              fi
              if [ -n "$sizes" ]; then
                echo "<details><summary>$(printf '%s\n' "$sizes" | wc -l) packages changed size only</summary>"
                echo
                printf '```\n%s\n```\n' "$sizes"
                echo '</details>'
                echo
              fi
            fi
            echo
            echo "<sub>Deployed \`$old\`<br>This PR \`$new\`</sub>"
          } | head -c 60000 > "$RUNNER_TEMP/closure-diff.md"

      - name: Comment the closure diff
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const body = require('fs').readFileSync(`${process.env.RUNNER_TEMP}/closure-diff.md`, 'utf8');
            const marker = body.split('\n')[0];
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const previous = comments.find((c) => c.user.type === 'Bot' && c.body.startsWith(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
