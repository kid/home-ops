#:schema https://secretspec.dev/schema/secretspec.schema.json
# Provider credentials for the tofu stacks, read from 1Password through
# `op`'s desktop-app integration. Run them through the justfile, which wraps
# them in `secretspec run`:
#   just tofu routeros-rb5009 plan
#   just tofu prd-k3s plan
# The `mcp` profile holds the tokens `.mcp.json` sends, cached in the system
# keyring so a new agent session doesn't hit 1Password's approval prompt.
[project]
name = "home-ops"
revision = "1.0"

[providers]
home_ops = "onepassword://home-ops"
keyring_cache = "keyring://secretspec/cache/{project}/{profile}/{key}"
home_ops_cached = { uri = "onepassword://home-ops", cache = { provider = "keyring_cache", max_age = "30d" } }

[profiles.default.defaults]
providers = ["home_ops"]

[profiles.default]
CLOUDFLARE_API_TOKEN = { description = "Cloudflare API token for the cloudflare provider", ref = { item = "Cloudflare - admin token", field = "credential" } }
OP_SERVICE_ACCOUNT_TOKEN = { description = "1Password service account token for the onepassword provider", ref = { item = "onepassword - admin", field = "credential" } }

[profiles.mcp.defaults]
inherit = false
providers = ["home_ops_cached"]

[profiles.mcp]
HOME_ASSISTANT_MCP_TOKEN = { description = "Home Assistant long-lived access token for its MCP server", ref = { item = "Home Assistant - mcp", field = "token" } }
