#:schema https://secretspec.dev/schema/secretspec.schema.json
# Provider credentials for the Terragrunt stacks, read from 1Password through
# `op`'s desktop-app integration. Run Terragrunt through the justfile, which
# wraps it in `secretspec run`:
#   just plan tf-stacks/prd/k3s/incus
[project]
name = "home-ops"
revision = "1.0"

[providers]
home_ops = "onepassword://home-ops"

[profiles.default.defaults]
providers = ["home_ops"]

[profiles.default]
CLOUDFLARE_API_TOKEN = { description = "Cloudflare API token for the cloudflare provider", ref = { item = "Cloudflare - admin token", field = "credential" } }
OP_SERVICE_ACCOUNT_TOKEN = { description = "1Password service account token for the onepassword provider", ref = { item = "onepassword - admin", field = "credential" } }
