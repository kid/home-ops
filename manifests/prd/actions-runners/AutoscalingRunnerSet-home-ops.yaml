apiVersion: actions.github.com/v1alpha1
kind: AutoscalingRunnerSet
metadata:
  annotations:
    actions.github.com/cleanup-manager-role-binding: home-ops-gha-rs-manager
    actions.github.com/cleanup-manager-role-name: home-ops-gha-rs-manager
    actions.github.com/cleanup-no-permission-service-account-name: home-ops-gha-rs-no-permission
    actions.github.com/values-hash: 4e59c8d5eb7d77c85dbd374df6983a377dc0d11066de921259e0941e24ee364
  labels:
    actions.github.com/scale-set-name: home-ops
    actions.github.com/scale-set-namespace: arc-runners
    app.kubernetes.io/component: autoscaling-runner-set
    app.kubernetes.io/instance: home-ops
    app.kubernetes.io/name: home-ops
    app.kubernetes.io/part-of: gha-rs
    app.kubernetes.io/version: 0.15.1
  name: home-ops
  namespace: arc-runners
spec:
  githubConfigSecret: arc-github-app
  githubConfigUrl: https://github.com/kid/home-ops
  listenerConfig:
    scaler:
      burst: 100
      qps: 50
  listenerTemplate:
    spec:
      containers:
        - name: listener
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
  maxRunners: 1
  minRunners: 0
  runnerScaleSetName: home-ops
  template:
    spec:
      containers:
        - command:
            - /home/runner/run.sh
          env:
            - name: PATH
              value: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/nix/var/nix/profiles/system/sw/bin
            - name: NIX_REMOTE
              value: daemon
            - name: NIX_CONFIG
              value: experimental-features = nix-command flakes pipe-operators
          image: ghcr.io/actions/actions-runner:2.338.2@sha256:6d0b2d80d80f143f77dcb676e50920100bbb547e39e883454d57f45ab8c31300
          name: runner
          resources:
            limits:
              memory: 8Gi
            requests:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - mountPath: /nix/store
              name: nix-store
              readOnly: true
            - mountPath: /nix/var/nix/daemon-socket
              name: nix-daemon-socket
            - mountPath: /nix/var/nix/profiles
              name: nix-profiles
              readOnly: true
      restartPolicy: Never
      serviceAccountName: home-ops-gha-rs-no-permission
      volumes:
        - hostPath:
            path: /nix/store
            type: Directory
          name: nix-store
        - hostPath:
            path: /nix/var/nix/daemon-socket
            type: Directory
          name: nix-daemon-socket
        - hostPath:
            path: /nix/var/nix/profiles
            type: Directory
          name: nix-profiles
