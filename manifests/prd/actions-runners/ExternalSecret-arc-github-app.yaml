apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arc-github-app
  namespace: arc-runners
spec:
  data:
    - remoteRef:
        key: github-arc-app/credentials/client-id
      secretKey: github_app_id
    - remoteRef:
        key: github-arc-app/credentials/installation-id
      secretKey: github_app_installation_id
    - remoteRef:
        decodingStrategy: Base64
        key: github-arc-app/credentials/private-key
      secretKey: github_app_private_key
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: arc-github-app
