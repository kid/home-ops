apiVersion: v1
kind: PersistentVolume
metadata:
  name: media-radarr-library
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 1Gi
  claimRef:
    name: radarr-library
    namespace: media
  hostPath:
    path: /tank/library/movies
    type: Directory
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
