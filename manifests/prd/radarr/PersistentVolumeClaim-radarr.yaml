apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: radarr
  namespace: media
spec:
  accessModes:
    - ReadWriteOncePod
  dataSourceRef:
    apiGroup: kopiur.home-operations.com
    kind: Restore
    name: radarr
  resources:
    requests:
      storage: 15Gi
  storageClassName: miroir-replicated
