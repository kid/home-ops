apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    actions.github.com/controller-service-account-name: arc
    actions.github.com/controller-service-account-namespace: arc-system
    app.kubernetes.io/instance: actions-runner-controller
    app.kubernetes.io/name: gha-rs-controller
    app.kubernetes.io/namespace: arc-system
    app.kubernetes.io/part-of: gha-rs-controller
  name: arc
  namespace: arc-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: actions-runner-controller
      app.kubernetes.io/name: gha-rs-controller
      app.kubernetes.io/namespace: arc-system
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        app.kubernetes.io/component: controller-manager
        app.kubernetes.io/instance: actions-runner-controller
        app.kubernetes.io/name: gha-rs-controller
        app.kubernetes.io/namespace: arc-system
        app.kubernetes.io/part-of: gha-rs-controller
    spec:
      containers:
        - args:
            - --auto-scaling-runner-set-only
            - --log-level=info
            - --log-format=json
            - --autoscaling-runner-set-max-concurrent-reconciles=2
            - --autoscaling-listener-max-concurrent-reconciles=2
            - --ephemeral-runner-set-max-concurrent-reconciles=2
            - --ephemeral-runner-max-concurrent-reconciles=4
            - --listener-metrics-addr=0
            - --listener-metrics-endpoint=
            - --metrics-addr=0
          command:
            - /manager
          env:
            - name: CONTROLLER_MANAGER_CONTAINER_IMAGE
              value: ghcr.io/actions/gha-runner-scale-set-controller:0.15.1
            - name: CONTROLLER_MANAGER_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          image: ghcr.io/actions/gha-runner-scale-set-controller:0.15.1
          imagePullPolicy: IfNotPresent
          name: manager
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 64Mi
          volumeMounts:
            - mountPath: /tmp
              name: tmp
      serviceAccountName: arc
      terminationGracePeriodSeconds: 35
      volumes:
        - emptyDir: {}
          name: tmp
