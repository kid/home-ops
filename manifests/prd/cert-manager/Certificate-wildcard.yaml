apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard
  namespace: cert-manager
spec:
  dnsNames:
    - '*.kidibox.net'
    - kidibox.net
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-prod
  privateKey:
    algorithm: ECDSA
    rotationPolicy: Always
    size: 256
  secretName: wildcard-tls
