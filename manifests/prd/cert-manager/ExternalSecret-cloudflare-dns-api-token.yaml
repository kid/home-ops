apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: cloudflare-dns-api-token
  namespace: cert-manager
spec:
  data:
    - remoteRef:
        key: cloudflare-dns-api-token
        property: token
      secretKey: token
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: cloudflare-dns-api-token
