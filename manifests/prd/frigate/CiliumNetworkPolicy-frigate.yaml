apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: frigate
  namespace: home-assistant
spec:
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: mosquitto
      toPorts:
        - ports:
            - port: "8883"
              protocol: TCP
    - toCIDR:
        - 10.0.50.10/32
        - 10.0.50.11/32
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "554"
              protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: frigate
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: envoy
            k8s:io.kubernetes.pod.namespace: envoy-gateway-system
      toPorts:
        - ports:
            - port: "5000"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: home-assistant
      toPorts:
        - ports:
            - port: "5000"
              protocol: TCP
            - port: "8554"
              protocol: TCP
