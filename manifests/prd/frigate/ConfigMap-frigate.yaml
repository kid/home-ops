apiVersion: v1
data:
  config.yml: |
    %YAML 1.1
    ---
    cameras:
      doorbell:
        ffmpeg:
          inputs:
          - input_args: preset-rtsp-restream
            path: rtsp://127.0.0.1:8554/doorbell
            roles:
            - record
          - input_args: preset-rtsp-restream
            path: rtsp://127.0.0.1:8554/doorbell_sub
            roles:
            - detect
        objects:
          track:
          - person
          - car
        review:
          alerts:
            labels:
            - person
            - car
            required_zones:
            - everywhere
            - lane
          detections:
            required_zones:
            - everywhere
            - street
        zones:
          delivery:
            coordinates: 0.06,0.48,0.25,0.48,0.25,0.76,0.06,0.76
            loitering_time: 3
            objects:
            - person
          everywhere:
            coordinates: 0,0,1,0,1,1,0,1
            objects:
            - person
          house:
            coordinates: 0,0.78,0.24,0.78,0.24,1,0,1
            inertia: 1
            objects:
            - person
          lane:
            coordinates: 0.25,0.42,0.88,0.42,0.88,0.8,0.25,0.8
            loitering_time: 10
            objects:
            - car
          street:
            coordinates: 0.25,0.42,0.88,0.42,0.88,0.8,0.25,0.8
            objects:
            - car
      litters:
        ffmpeg:
          inputs:
          - input_args: preset-rtsp-restream
            path: rtsp://127.0.0.1:8554/litters
            roles:
            - record
          - input_args: preset-rtsp-restream
            path: rtsp://127.0.0.1:8554/litters_sub
            roles:
            - detect
        objects:
          track:
          - cat
        review:
          alerts:
            labels:
            - cat
    detect:
      enabled: true
    detectors:
      ov:
        device: GPU
        type: openvino
    ffmpeg:
      hwaccel_args: preset-vaapi
    go2rtc:
      streams:
        doorbell:
        - ffmpeg:http://10.0.50.10/flv?port=1935&app=bcs&stream=channel0_main.bcs&user={FRIGATE_DOORBELL_USER}&password={FRIGATE_DOORBELL_PASSWORD}#video=copy#audio=copy#audio=opus
        doorbell_sub:
        - ffmpeg:http://10.0.50.10/flv?port=1935&app=bcs&stream=channel0_ext.bcs&user={FRIGATE_DOORBELL_USER}&password={FRIGATE_DOORBELL_PASSWORD}
        litters:
        - ffmpeg:http://10.0.50.11/flv?port=1935&app=bcs&stream=channel0_main.bcs&user={FRIGATE_LITTERS_USER}&password={FRIGATE_LITTERS_PASSWORD}#video=copy#audio=copy#audio=opus
        litters_sub:
        - ffmpeg:http://10.0.50.11/flv?port=1935&app=bcs&stream=channel0_ext.bcs&user={FRIGATE_LITTERS_USER}&password={FRIGATE_LITTERS_PASSWORD}
    model:
      height: 300
      input_pixel_format: bgr
      input_tensor: nhwc
      labelmap_path: /openvino-model/coco_91cl_bkgr.txt
      path: /openvino-model/ssdlite_mobilenet_v2.xml
      width: 300
    mqtt:
      host: mosquitto.home-assistant.svc
      password: '{FRIGATE_MQTT_PASSWORD}'
      port: 8883
      tls_ca_certs: /etc/cluster-ca/ca.crt
      user: frigate
    record:
      alerts:
        retain:
          days: 14
          mode: motion
      continuous:
        days: 0
      detections:
        retain:
          days: 14
          mode: motion
      enabled: true
      motion:
        days: 0
    snapshots:
      enabled: true
      retain:
        default: 14
    telemetry:
      stats:
        intel_gpu_device: /dev/dri/renderD128
kind: ConfigMap
metadata:
  name: frigate
  namespace: home-assistant
