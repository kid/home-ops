apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: frigate-cameras
  namespace: home-assistant
spec:
  data:
    - remoteRef:
        key: reolink-doorbell/username
      secretKey: doorbell-username
    - remoteRef:
        key: reolink-doorbell/password
      secretKey: doorbell-password
    - remoteRef:
        key: reolink-litters/username
      secretKey: litters-username
    - remoteRef:
        key: reolink-litters/password
      secretKey: litters-password
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: frigate-cameras
