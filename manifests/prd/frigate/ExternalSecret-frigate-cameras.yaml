apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: frigate-cameras
  namespace: home-assistant
spec:
  data:
    - remoteRef:
        key: frigate-cameras/username
      secretKey: username
    - remoteRef:
        key: frigate-cameras/password
      secretKey: password
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: frigate-cameras
