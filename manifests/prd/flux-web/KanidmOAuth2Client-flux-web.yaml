apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: flux-web
  namespace: flux-system
spec:
  disableConsentPrompt: true
  displayname: flux-web
  kanidmRef:
    name: idm
    namespace: kanidm
  origin: https://flux.kidibox.net
  redirectUrl:
    - https://flux.kidibox.net/oauth2/callback
  scopeMap:
    - group: admins
      scopes:
        - openid
        - profile
        - email
  secretKeyAliases:
    clientSecret:
      - client-secret
