apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flux-operator-mcp
  namespace: flux-system
spec:
  hostnames:
    - flux.kidibox.net
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: apps
      namespace: envoy-gateway-system
      sectionName: https
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: flux-operator-mcp
          port: 9090
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /mcp
