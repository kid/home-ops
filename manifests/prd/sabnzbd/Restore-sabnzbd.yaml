apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: sabnzbd
  namespace: media
spec:
  credentialProjection:
    enabled: true
  mover:
    privilegedMode: true
    securityContext:
      runAsGroup: 0
      runAsNonRoot: false
      runAsUser: 0
  policy:
    onMissingSnapshot: Continue
  repository:
    kind: ClusterRepository
    name: local
  source:
    identity:
      hostname: sabnzbd-full
      sourcePath: /pvc/sabnzbd
      username: sabnzbd-full
  target:
    populator: {}
