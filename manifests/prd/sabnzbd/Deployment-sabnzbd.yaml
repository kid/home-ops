apiVersion: apps/v1
kind: Deployment
metadata:
  name: sabnzbd
  namespace: media
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: sabnzbd
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sabnzbd
    spec:
      automountServiceAccountToken: false
      containers:
        - env:
            - name: SABNZBD__HOST_WHITELIST_ENTRIES
              value: sabnzbd.kidibox.net, sabnzbd.media.svc.cluster.local
          image: ghcr.io/home-operations/sabnzbd:5.1.3@sha256:c89b0322721c3eba47221e5f916505e7e742684651f73c5215717340b6b5402f
          livenessProbe:
            httpGet:
              httpHeaders:
                - name: Host
                  value: localhost
              path: /api?mode=version
              port: http
          name: sabnzbd
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              httpHeaders:
                - name: Host
                  value: localhost
              path: /api?mode=version
              port: http
          resources:
            limits:
              memory: 3Gi
            requests:
              cpu: 50m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          startupProbe:
            failureThreshold: 60
            httpGet:
              httpHeaders:
                - name: Host
                  value: localhost
              path: /api?mode=version
              port: http
          volumeMounts:
            - mountPath: /config
              name: config
            - mountPath: /config/logs
              name: logs
            - mountPath: /tmp
              name: tmp
            - mountPath: /var/lib/sabnzbd/Downloads
              name: downloads
      securityContext:
        fsGroup: 100330
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 100330
        runAsNonRoot: true
        runAsUser: 100330
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: sabnzbd
        - name: downloads
          nfs:
            path: /mnt/tank/downloads/sabnzbd
            server: 10.0.20.126
        - emptyDir: {}
          name: logs
        - emptyDir: {}
          name: tmp
