apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: sabnzbd-full
  namespace: media
spec:
  credentialProjection:
    enabled: true
  files:
    ignoreRules:
      - /lost+found
  identity:
    hostname: sabnzbd-full
    username: sabnzbd-full
  mover:
    privilegedMode: true
    resources:
      limits:
        memory: 1Gi
      requests:
        cpu: 50m
        memory: 512Mi
    securityContext:
      runAsGroup: 0
      runAsNonRoot: false
      runAsUser: 0
  repository:
    kind: ClusterRepository
    name: local
  retention:
    keepDaily: 7
    keepWeekly: 4
  sources:
    - pvc:
        name: sabnzbd
  staging:
    storageClassName: miroir
