apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-public
  namespace: argocd
spec:
  hostnames:
    - argocd.kidibox.net
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: cloudflare-tunnel
      namespace: cloudflare-tunnel-system
      sectionName: http
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: envoy-gateway-apps
          namespace: envoy-gateway-system
          port: 443
          weight: 1
