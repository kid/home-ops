apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/name: argocd-server
    app.kubernetes.io/part-of: argocd
  name: argocd-server
  namespace: argocd
spec:
  ports:
    - name: http
      port: 80
      targetPort: 8080
    - appProtocol: kubernetes.io/h2c
      name: https
      port: 443
      targetPort: 8080
  selector:
    app.kubernetes.io/name: argocd-server
