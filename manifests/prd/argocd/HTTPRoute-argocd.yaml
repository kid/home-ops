apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  hostnames:
    - argocd.kidibox.net
  parentRefs:
    - name: apps
      namespace: gateway
      sectionName: https
  rules:
    - backendRefs:
        - name: argocd-server
          port: 443
