apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-argocd
  namespace: argocd
spec:
  hostnames:
    - argocd.kidibox.net
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: apps
      namespace: envoy-gateway-system
      sectionName: https
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: mcp-argocd
          port: 3000
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /mcp
