apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-argocd
  namespace: argocd
spec:
  data:
    - remoteRef:
        key: argocd/secrets/mcp-api-token
      secretKey: ARGOCD_API_TOKEN
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: mcp-argocd
