apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: argocd
  namespace: argocd
spec:
  allowLocalhostRedirect: true
  displayname: Argo CD
  kanidmRef:
    name: idm
    namespace: kanidm
  origin: https://argocd.kidibox.net
  public: true
  redirectUrl:
    - https://argocd.kidibox.net/auth/callback
  scopeMap:
    - group: admins
      scopes:
        - openid
        - profile
        - email
        - groups_name
