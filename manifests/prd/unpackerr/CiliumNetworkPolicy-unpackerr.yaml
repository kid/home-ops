apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: unpackerr
  namespace: media
spec:
  egress:
    - toEndpoints:
        - matchLabels: {}
      toPorts:
        - ports:
            - port: "7878"
              protocol: TCP
            - port: "8989"
              protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: unpackerr
