apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  namespace: media
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: sonarr
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sonarr
    spec:
      automountServiceAccountToken: false
      containers:
        - env:
            - name: SONARR__AUTH__APIKEY
              valueFrom:
                secretKeyRef:
                  key: api-key
                  name: sonarr-api-key
            - name: SONARR__AUTH__METHOD
              value: External
            - name: SONARR__AUTH__REQUIRED
              value: DisabledForLocalAddresses
            - name: SONARR__LOG__DBENABLED
              value: "false"
            - name: SONARR__LOG__LEVEL
              value: info
            - name: SONARR__SERVER__ALLOWEDHOSTS
              value: sonarr.kidibox.net,sonarr.media.svc.cluster.local
          image: ghcr.io/home-operations/sonarr:4.0.20.3012@sha256:1f19eb5e0f421418c1a956bbe01310a0141423afe28bd9a4b1dcb8629ff2bce2
          livenessProbe:
            httpGet:
              httpHeaders:
                - name: Host
                  value: localhost
              path: /ping
              port: http
          name: sonarr
          ports:
            - containerPort: 8989
              name: http
          readinessProbe:
            httpGet:
              httpHeaders:
                - name: Host
                  value: localhost
              path: /ping
              port: http
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 50m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          startupProbe:
            failureThreshold: 60
            httpGet:
              httpHeaders:
                - name: Host
                  value: localhost
              path: /ping
              port: http
          volumeMounts:
            - mountPath: /config
              name: config
            - mountPath: /config/logs
              name: logs
            - mountPath: /tank/library/series
              name: library
            - mountPath: /tmp
              name: tmp
            - mountPath: /var/lib/sabnzbd/Downloads
              name: downloads
      securityContext:
        fsGroup: 100351
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 100351
        runAsNonRoot: true
        runAsUser: 100351
        seccompProfile:
          type: RuntimeDefault
        supplementalGroups:
          - 100330
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: sonarr
        - name: downloads
          nfs:
            path: /tank/downloads/sabnzbd
            server: 10.0.20.10
        - name: library
          nfs:
            path: /tank/library/series
            server: 10.0.20.10
        - emptyDir: {}
          name: logs
        - emptyDir: {}
          name: tmp
