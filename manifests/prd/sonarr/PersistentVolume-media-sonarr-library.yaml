apiVersion: v1
kind: PersistentVolume
metadata:
  name: media-sonarr-library
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 1Gi
  claimRef:
    name: sonarr-library
    namespace: media
  hostPath:
    path: /tank/library/series
    type: Directory
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
