apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarr
  namespace: media
spec:
  accessModes:
    - ReadWriteOncePod
  dataSourceRef:
    apiGroup: kopiur.home-operations.com
    kind: Restore
    name: sonarr
  resources:
    requests:
      storage: 2Gi
  storageClassName: miroir-replicated
