apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: node-host-firewall
spec:
  ingress:
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "9962"
              protocol: TCP
            - port: "9965"
              protocol: TCP
            - port: "9963"
              protocol: TCP
            - port: "9100"
              protocol: TCP
            - port: "10250"
              protocol: TCP
    - fromEntities:
        - cluster
        - remote-node
      toPorts:
        - ports:
            - port: "9879"
              protocol: TCP
            - port: "4244"
              protocol: TCP
            - port: "9810"
              protocol: TCP
            - endPort: 7999
              port: "7000"
              protocol: TCP
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: "22"
              protocol: TCP
    - fromEntities:
        - remote-node
      toPorts:
        - ports:
            - endPort: 2380
              port: "2379"
              protocol: TCP
    - fromCIDR:
        - 10.0.40.40/32
      toPorts:
        - ports:
            - endPort: 2380
              port: "2379"
              protocol: TCP
  nodeSelector: {}
