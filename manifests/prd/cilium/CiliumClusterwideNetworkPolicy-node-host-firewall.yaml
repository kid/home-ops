apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: node-host-firewall
spec:
  ingress:
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
            - port: "10250"
              protocol: TCP
    - fromEntities:
        - cluster
        - remote-node
      toPorts:
        - ports:
            - port: "9879"
              protocol: TCP
            - port: "4244"
              protocol: TCP
            - port: "9810"
              protocol: TCP
            - endPort: 7999
              port: "7000"
              protocol: TCP
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: "22"
              protocol: TCP
  nodeSelector: {}
