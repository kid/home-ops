apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: node-host-firewall
spec:
  ingress:
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "9962"
              protocol: TCP
            - port: "9965"
              protocol: TCP
            - port: "9963"
              protocol: TCP
            - port: "9100"
              protocol: TCP
            - port: "10250"
              protocol: TCP
    - fromEntities:
        - cluster
        - remote-node
      toPorts:
        - ports:
            - port: "9879"
              protocol: TCP
            - port: "4244"
              protocol: TCP
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: "22"
              protocol: TCP
    - fromCIDR:
        - 10.0.100.0/24
      toPorts:
        - ports:
            - port: "631"
              protocol: TCP
    - fromCIDR:
        - 10.0.20.0/24
      toPorts:
        - ports:
            - port: "2049"
              protocol: TCP
  nodeSelector: {}
