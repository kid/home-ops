apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: host-ssh-servers-only
spec:
  ingress:
    - fromEntities:
        - cluster
    - fromCIDR:
        - 10.0.10.0/24
      toPorts:
        - ports:
            - port: "22"
              protocol: TCP
  nodeSelector:
    matchLabels:
      kidibox.net/ssh-servers-only: "true"
