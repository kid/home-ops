apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: hubble-ui
  namespace: kube-system
spec:
  oidc:
    clientID: hubble-ui
    clientSecret:
      name: hubble-ui-kanidm-oauth2-credentials
    logoutPath: /oauth2/logout
    provider:
      issuer: https://idm.kidibox.net/oauth2/openid/hubble-ui
    redirectURL: https://hubble.kidibox.net/oauth2/callback
    scopes:
      - openid
      - profile
      - email
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: hubble-ui
