apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: node-host-firewall-control-plane
spec:
  ingress:
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "10259"
              protocol: TCP
            - port: "10257"
              protocol: TCP
            - port: "2381"
              protocol: TCP
            - port: "6443"
              protocol: TCP
    - fromCIDR:
        - 10.0.40.10/32
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
  nodeSelector:
    matchLabels:
      node-role.kubernetes.io/control-plane: "true"
