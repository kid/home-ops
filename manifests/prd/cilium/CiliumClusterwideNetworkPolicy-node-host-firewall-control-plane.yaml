apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: node-host-firewall-control-plane
spec:
  ingress:
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "10259"
              protocol: TCP
            - port: "10257"
              protocol: TCP
            - port: "2381"
              protocol: TCP
    - fromEntities:
        - cluster
        - world
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    - fromEntities:
        - remote-node
      toPorts:
        - ports:
            - endPort: 2380
              port: "2379"
              protocol: TCP
    - fromCIDR:
        - 10.0.40.40/32
        - 10.0.40.41/32
        - 10.0.40.42/32
      toPorts:
        - ports:
            - endPort: 2380
              port: "2379"
              protocol: TCP
  nodeSelector:
    matchLabels:
      node-role.kubernetes.io/control-plane: "true"
