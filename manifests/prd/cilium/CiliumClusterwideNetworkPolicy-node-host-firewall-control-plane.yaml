apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: node-host-firewall-control-plane
spec:
  ingress:
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
  nodeSelector:
    matchLabels:
      node-role.kubernetes.io/control-plane: "true"
