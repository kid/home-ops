apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-cluster
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
      path: secret
      server: http://openbao.openbao.svc:8200
      version: v2
