apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plex
  namespace: media
spec:
  accessModes:
    - ReadWriteOncePod
  dataSourceRef:
    apiGroup: kopiur.home-operations.com
    kind: Restore
    name: plex
  resources:
    requests:
      storage: 40Gi
  storageClassName: miroir-replicated
