apiVersion: v1
kind: PersistentVolume
metadata:
  name: media-plex-library
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 1Gi
  claimRef:
    name: plex-library
    namespace: media
  hostPath:
    path: /tank/library
    type: Directory
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
