apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: plex
  namespace: media
spec:
  credentialProjection:
    enabled: true
  mover:
    privilegedMode: true
    securityContext:
      runAsGroup: 0
      runAsNonRoot: false
      runAsUser: 0
  policy:
    onMissingSnapshot: Fail
  repository:
    kind: ClusterRepository
    name: local
  source:
    identity:
      hostname: plex-full
      sourcePath: /pvc/plex
      username: plex-full
  target:
    populator: {}
