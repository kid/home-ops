apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: snapshot-controller
    app.kubernetes.io/name: snapshot-controller
  name: snapshot-controller
  namespace: snapshot-controller
spec:
  minReadySeconds: 35
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: snapshot-controller
      app.kubernetes.io/name: snapshot-controller
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: snapshot-controller
        app.kubernetes.io/name: snapshot-controller
    spec:
      containers:
        - args:
            - --v=2
            - --leader-election=true
            - --leader-election-namespace=$(NAMESPACE)
            - --http-endpoint=:8080
            - --feature-gates=CSIVolumeGroupSnapshot=true
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          image: registry.k8s.io/sig-storage/snapshot-controller:v8.6.0
          imagePullPolicy: IfNotPresent
          livenessProbe:
            httpGet:
              path: /healthz/leader-election
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 20
          name: snapshot-controller
          ports:
            - containerPort: 8080
              name: metrics
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz/leader-election
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          resources: {}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
      enableServiceLinks: false
      priorityClassName: system-cluster-critical
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: snapshot-controller
