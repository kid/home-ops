apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/instance: snapshot-controller
    app.kubernetes.io/name: snapshot-controller
  name: snapshot-controller-leaderelection
  namespace: snapshot-controller
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - watch
      - list
      - delete
      - update
      - create
