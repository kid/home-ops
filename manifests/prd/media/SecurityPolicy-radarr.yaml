apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: radarr
  namespace: media
spec:
  oidc:
    clientID: radarr
    clientSecret:
      name: radarr-kanidm-oauth2-credentials
    logoutPath: /oauth2/logout
    provider:
      issuer: https://idm.kidibox.net/oauth2/openid/radarr
    redirectURL: https://radarr.kidibox.net/oauth2/callback
    scopes:
      - openid
      - profile
      - email
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: radarr
