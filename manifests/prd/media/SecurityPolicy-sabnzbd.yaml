apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: sabnzbd
  namespace: media
spec:
  oidc:
    clientID: sabnzbd
    clientSecret:
      name: sabnzbd-kanidm-oauth2-credentials
    logoutPath: /oauth2/logout
    provider:
      authorizationEndpoint: https://idm.kidibox.net/ui/oauth2
      issuer: https://idm.kidibox.net/oauth2/openid/sabnzbd
      tokenEndpoint: https://idm.kidibox.net/oauth2/token
    redirectURL: https://sabnzbd.kidibox.net/oauth2/callback
    scopes:
      - openid
      - profile
      - email
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: sabnzbd
