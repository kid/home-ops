apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: prowlarr
  namespace: media
spec:
  oidc:
    clientID: prowlarr
    clientSecret:
      name: prowlarr-kanidm-oauth2-credentials
    logoutPath: /oauth2/logout
    provider:
      authorizationEndpoint: https://idm.kidibox.net/ui/oauth2
      issuer: https://idm.kidibox.net/oauth2/openid/prowlarr
      tokenEndpoint: https://idm.kidibox.net/oauth2/token
    redirectURL: https://prowlarr.kidibox.net/oauth2/callback
    scopes:
      - openid
      - profile
      - email
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: prowlarr
