apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: sonarr
  namespace: media
spec:
  disableConsentPrompt: true
  displayname: sonarr
  kanidmRef:
    name: idm
    namespace: kanidm
  origin: https://sonarr.kidibox.net
  redirectUrl:
    - https://sonarr.kidibox.net/oauth2/callback
  scopeMap:
    - group: media
      scopes:
        - openid
        - profile
        - email
  secretKeyAliases:
    clientSecret:
      - client-secret
