apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-github-app
  namespace: renovate
spec:
  data:
    - remoteRef:
        key: github-renovate-app/credentials/client-id
      secretKey: client-id
    - remoteRef:
        key: github-renovate-app/credentials/installation-id
      secretKey: installation-id
    - remoteRef:
        decodingStrategy: Base64
        key: github-renovate-app/credentials/private-key
      secretKey: private-key
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: renovate-github-app
