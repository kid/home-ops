apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-webhook-token
  namespace: renovate
spec:
  data:
    - remoteRef:
        key: renovate-webhook/credentials/token
      secretKey: token
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: renovate-webhook-token
