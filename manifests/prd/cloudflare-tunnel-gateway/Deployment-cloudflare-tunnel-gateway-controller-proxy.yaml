apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: proxy
    app.kubernetes.io/instance: cloudflare-tunnel-gateway-controller
    app.kubernetes.io/name: cloudflare-tunnel-gateway-controller-proxy
  name: cloudflare-tunnel-gateway-controller-proxy
  namespace: cloudflare-tunnel-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: proxy
      app.kubernetes.io/instance: cloudflare-tunnel-gateway-controller
      app.kubernetes.io/name: cloudflare-tunnel-gateway-controller-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/component: proxy
        app.kubernetes.io/instance: cloudflare-tunnel-gateway-controller
        app.kubernetes.io/name: cloudflare-tunnel-gateway-controller-proxy
    spec:
      automountServiceAccountToken: false
      containers:
        - env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  key: tunnel-token
                  name: cloudflare-tunnel-connector-token
            - name: PROXY_CONFIG_ADDR
              value: :8081
            - name: PROXY_ADDR
              value: :8080
            - name: PROXY_GRACE_PERIOD
              value: 30s
            - name: PROXY_METRICS_ENABLED
              value: "true"
            - name: PROXY_TUNNEL_PROTOCOL
              value: auto
            - name: PROXY_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  key: auth-token
                  name: cloudflare-tunnel-gateway-controller-proxy-auth-token
          image: ghcr.io/lexfrei/cloudflare-tunnel-gateway-controller-proxy:3.5.0
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: config-api
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          name: proxy
          ports:
            - containerPort: 8081
              name: config-api
              protocol: TCP
            - containerPort: 8080
              name: proxy
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /readyz
              port: config-api
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /healthz
              port: config-api
            initialDelaySeconds: 0
            periodSeconds: 5
            timeoutSeconds: 3
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 45
