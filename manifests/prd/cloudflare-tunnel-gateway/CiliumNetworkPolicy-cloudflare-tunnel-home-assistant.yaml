apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cloudflare-tunnel-home-assistant
  namespace: cloudflare-tunnel-system
spec:
  egress:
    - toCIDR:
        - 10.0.10.101/32
      toPorts:
        - ports:
            - port: "8123"
              protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: cloudflare-tunnel-gateway-controller-proxy
