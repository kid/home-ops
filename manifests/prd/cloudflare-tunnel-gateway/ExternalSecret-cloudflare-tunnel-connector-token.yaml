apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-tunnel-connector-token
  namespace: cloudflare-tunnel-system
spec:
  data:
    - remoteRef:
        key: cloudflared-tunnel-credentials/credentials/tunnel-token
      secretKey: tunnel-token
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: cloudflare-tunnel-connector-token
