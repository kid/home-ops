apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-3"
  labels:
    app.kubernetes.io/component: crd-install-hook
    app.kubernetes.io/instance: sops-operator
    app.kubernetes.io/name: sops-operator
  name: sops-operator-crds
  namespace: sops-operator
rules:
  - apiGroups:
      - ""
    resources:
      - jobs
    verbs:
      - create
      - delete
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - create
      - delete
      - get
      - patch
