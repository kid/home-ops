apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-victoriametrics
  namespace: mcp
spec:
  hostnames:
    - mcp-metrics.kidibox.net
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: apps
      namespace: envoy-gateway-system
      sectionName: https
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: mcp-victoriametrics
          port: 8080
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
