apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mcp-victorialogs
  namespace: mcp
spec:
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: vlsingle
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "9428"
              protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: mcp-victorialogs
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: envoy
            k8s:io.kubernetes.pod.namespace: envoy-gateway-system
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
