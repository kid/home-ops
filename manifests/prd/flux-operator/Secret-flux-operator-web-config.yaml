apiVersion: v1
kind: Secret
metadata:
  labels:
    app.kubernetes.io/instance: flux-operator
    app.kubernetes.io/name: flux-operator
  name: flux-operator-web-config
  namespace: flux-system
stringData:
  config.yaml: |
    apiVersion: web.fluxcd.controlplane.io/v1
    kind: Config
    spec:
      authentication:
        anonymous:
          groups:
          - flux-web-admins
        type: Anonymous
      metrics:
        disabled: true
      userActions:
        access: Impersonated
type: Opaque
