apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: flux-operator
    app.kubernetes.io/name: flux-operator
  name: flux-operator
  namespace: flux-system
spec:
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: http-metrics
    - name: http-web
      port: 9080
      protocol: TCP
      targetPort: http-web
  selector:
    app.kubernetes.io/instance: flux-operator
    app.kubernetes.io/name: flux-operator
