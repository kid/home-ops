apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: zigbee2mqtt
  namespace: home-assistant
spec:
  credentialProjection:
    enabled: true
  mover:
    privilegedMode: true
    securityContext:
      runAsGroup: 0
      runAsNonRoot: false
      runAsUser: 0
  policy:
    onMissingSnapshot: Fail
  repository:
    kind: ClusterRepository
    name: local
  source:
    identity:
      hostname: zigbee2mqtt-full
      sourcePath: /pvc/zigbee2mqtt
      username: zigbee2mqtt-full
  target:
    populator: {}
