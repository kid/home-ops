apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: zigbee2mqtt
  namespace: home-assistant
spec:
  credentialProjection:
    enabled: true
  identity:
    hostname: zigbee2mqtt
    username: zigbee2mqtt
  mover:
    resources:
      requests:
        cpu: 50m
        memory: 192Mi
    securityContext:
      runAsGroup: 1000
      runAsUser: 1000
  repository:
    kind: ClusterRepository
    name: r2
  retention:
    keepDaily: 14
    keepWeekly: 4
  sources:
    - pvc:
        name: zigbee2mqtt
  staging:
    storageClassName: miroir
