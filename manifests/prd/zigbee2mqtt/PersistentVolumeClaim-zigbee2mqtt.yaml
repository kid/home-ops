apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zigbee2mqtt
  namespace: home-assistant
spec:
  accessModes:
    - ReadWriteOncePod
  dataSourceRef:
    apiGroup: kopiur.home-operations.com
    kind: Restore
    name: zigbee2mqtt
  resources:
    requests:
      storage: 1Gi
  storageClassName: miroir-replicated
