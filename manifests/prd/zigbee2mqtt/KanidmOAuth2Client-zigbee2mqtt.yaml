apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: zigbee2mqtt
  namespace: home-assistant
spec:
  disableConsentPrompt: true
  displayname: zigbee2mqtt
  kanidmRef:
    name: idm
    namespace: kanidm
  origin: https://zigbee2mqtt.kidibox.net
  redirectUrl:
    - https://zigbee2mqtt.kidibox.net/oauth2/callback
  scopeMap:
    - group: admins
      scopes:
        - openid
        - profile
        - email
  secretKeyAliases:
    clientSecret:
      - client-secret
