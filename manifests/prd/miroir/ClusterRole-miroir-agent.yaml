apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/instance: miroir
    app.kubernetes.io/name: miroir
  name: miroir-agent
rules:
  - apiGroups:
      - miroir.home-operations.com
    resources:
      - miroirvolumes
      - miroirsnapshots
      - miroirsnapshotgroups
    verbs:
      - get
      - list
      - watch
      - update
  - apiGroups:
      - miroir.home-operations.com
    resources:
      - miroirvolumes/status
      - miroirsnapshots/status
      - miroirsnapshotgroups/status
    verbs:
      - get
      - patch
  - apiGroups:
      - miroir.home-operations.com
    resources:
      - miroirnodes
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - miroir.home-operations.com
    resources:
      - miroirnodes/status
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  - apiGroups:
      - events.k8s.io
    resources:
      - events
    verbs:
      - create
      - patch
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - get
      - list
      - watch
