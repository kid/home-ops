apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  labels:
    app.kubernetes.io/instance: miroir
    app.kubernetes.io/name: miroir
  name: miroir
  namespace: miroir-system
spec:
  podMetricsEndpoints:
    - interval: 30s
      path: /metrics
      port: metrics
      relabelings:
        - sourceLabels:
            - __meta_kubernetes_pod_node_name
          targetLabel: node
      scrapeTimeout: 10s
  selector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - controller
          - agent
    matchLabels:
      app.kubernetes.io/instance: miroir
      app.kubernetes.io/name: miroir
