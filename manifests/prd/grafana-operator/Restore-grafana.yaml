apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: grafana
  namespace: monitoring
spec:
  credentialProjection:
    enabled: true
  mover:
    privilegedMode: true
    securityContext:
      runAsGroup: 0
      runAsNonRoot: false
      runAsUser: 0
  policy:
    onMissingSnapshot: Continue
  repository:
    kind: ClusterRepository
    name: local
  source:
    identity:
      hostname: grafana-full
      sourcePath: /pvc/grafana
      username: grafana-full
  target:
    populator: {}
