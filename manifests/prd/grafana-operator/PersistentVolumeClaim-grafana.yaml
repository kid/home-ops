apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOncePod
  dataSourceRef:
    apiGroup: kopiur.home-operations.com
    kind: Restore
    name: grafana
  resources:
    requests:
      storage: 1Gi
  storageClassName: zfs
