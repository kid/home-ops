apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mosquitto-tls
  namespace: home-assistant
spec:
  dnsNames:
    - mosquitto
    - mosquitto.home-assistant
    - mosquitto.home-assistant.svc
    - mosquitto.home-assistant.svc.cluster.local
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: cluster-ca
  privateKey:
    algorithm: ECDSA
    size: 256
  secretName: mosquitto-tls
