apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mosquitto-home-assistant
  namespace: home-assistant
spec:
  data:
    - remoteRef:
        key: mosquitto-home-assistant/credentials/password
      secretKey: password
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: mosquitto-home-assistant
