apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mosquitto
  namespace: home-assistant
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: mosquitto
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: home-assistant
      toPorts:
        - ports:
            - port: "8883"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: zigbee2mqtt
      toPorts:
        - ports:
            - port: "8883"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: frigate
      toPorts:
        - ports:
            - port: "8883"
              protocol: TCP
