apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: webhook
    app.kubernetes.io/instance: kaniop
    app.kubernetes.io/name: kaniop
    app.kubernetes.io/part-of: kaniop
  name: kaniop-webhook
  namespace: kanidm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: webhook
      app.kubernetes.io/instance: kaniop
      app.kubernetes.io/name: kaniop
  template:
    metadata:
      labels:
        app.kubernetes.io/component: webhook
        app.kubernetes.io/instance: kaniop
        app.kubernetes.io/name: kaniop
    spec:
      containers:
        - command:
            - kaniop-webhook
          env:
            - name: PORT
              value: "8443"
            - name: LOG_FILTER
              value: info
            - name: LOG_FORMAT
              value: text
            - name: TLS_CERT
              value: /etc/webhook/certs/tls.crt
            - name: TLS_KEY
              value: /etc/webhook/certs/tls.key
          image: ghcr.io/pando85/kaniop-webhook:0.19.3
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /livez
              port: webhook
              scheme: HTTPS
            initialDelaySeconds: 0
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          name: webhook
          ports:
            - containerPort: 8443
              name: webhook
              protocol: TCP
          readinessProbe:
            failureThreshold: 2
            httpGet:
              path: /readyz
              port: webhook
              scheme: HTTPS
            initialDelaySeconds: 0
            periodSeconds: 2
            successThreshold: 1
            timeoutSeconds: 1
          resources:
            limits:
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /etc/webhook/certs
              name: webhook-certs
              readOnly: true
      securityContext:
        fsGroup: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: kaniop
      volumes:
        - name: webhook-certs
          secret:
            secretName: kaniop-webhook-cert
