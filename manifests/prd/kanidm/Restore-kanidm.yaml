apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: kanidm
  namespace: kanidm
spec:
  credentialProjection:
    enabled: true
  mover:
    privilegedMode: true
    securityContext:
      runAsGroup: 0
      runAsNonRoot: false
      runAsUser: 0
  policy:
    onMissingSnapshot: Continue
  repository:
    kind: ClusterRepository
    name: local
  source:
    identity:
      hostname: kanidm-full
      sourcePath: /pvc/kanidm-data-idm-default-0
      username: kanidm-full
  target:
    populator: {}
