apiVersion: kaniop.rs/v1beta1
kind: Kanidm
metadata:
  name: idm
  namespace: kanidm
spec:
  automountServiceAccountToken: false
  containers:
    - name: kanidm
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
  domain: idm.kidibox.net
  env:
    - name: KANIDM_TRUST_X_FORWARDED_FOR
      value: "true"
    - name: KANIDM_ONLINE_BACKUP_PATH
      value: /data/backups
    - name: KANIDM_ONLINE_BACKUP_SCHEDULE
      value: 00 03 * * *
    - name: KANIDM_ONLINE_BACKUP_VERSIONS
      value: "7"
  groupNamespaceSelector: {}
  image: docker.io/kanidm/server:1.12.0@sha256:71b6ff5a9c9c32b632894d8acef5a2afc77941b35a0aa95dcee959fe688d5ce9
  oauth2ClientNamespaceSelector: {}
  origin: https://idm.kidibox.net
  personNamespaceSelector: {}
  replicaGroups:
    - name: default
      replicas: 1
      resources:
        limits:
          memory: 512Mi
        requests:
          cpu: 50m
          memory: 128Mi
  securityContext:
    fsGroup: 389
    fsGroupChangePolicy: OnRootMismatch
    runAsGroup: 389
    runAsNonRoot: true
    runAsUser: 389
    seccompProfile:
      type: RuntimeDefault
  serviceAccountNamespaceSelector: {}
  storage:
    volumeClaimTemplate:
      spec:
        accessModes:
          - ReadWriteOncePod
        dataSourceRef:
          apiGroup: kopiur.home-operations.com
          kind: Restore
          name: kanidm
        resources:
          requests:
            storage: 1Gi
        storageClassName: miroir-replicated
  tlsSecretName: idm-tls
