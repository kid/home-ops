apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: kanidm-smtp
  namespace: kanidm
spec:
  data:
    - remoteRef:
        key: kanidm/secrets/smtp-password
      secretKey: password
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: kanidm-smtp
    template:
      data:
        password: '{{ .password }}'
        username: arnaud.rebts@gmail.com
