apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: idm
  namespace: kanidm
spec:
  hostnames:
    - idm.kidibox.net
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: apps
      namespace: envoy-gateway-system
      sectionName: https
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: idm
          port: 8443
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
