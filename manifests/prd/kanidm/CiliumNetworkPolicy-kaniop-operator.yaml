apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kaniop-operator
  namespace: kanidm
spec:
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: kanidm
            kanidm.kaniop.rs/cluster: idm
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: operator
      app.kubernetes.io/name: kaniop
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: vmagent
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
