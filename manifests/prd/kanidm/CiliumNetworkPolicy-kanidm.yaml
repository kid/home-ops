apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kanidm
  namespace: kanidm
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kanidm
      kanidm.kaniop.rs/cluster: idm
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: envoy
            k8s:io.kubernetes.pod.namespace: envoy-gateway-system
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/component: operator
            app.kubernetes.io/name: kaniop
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
