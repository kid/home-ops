apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kanidm-mail-sender
  namespace: kanidm
spec:
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: envoy
            k8s:io.kubernetes.pod.namespace: envoy-gateway-system
      toPorts:
        - ports:
            - port: "10443"
              protocol: TCP
    - toFQDNs:
        - matchName: smtp.gmail.com
      toPorts:
        - ports:
            - port: "587"
              protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kanidm-mail-sender
