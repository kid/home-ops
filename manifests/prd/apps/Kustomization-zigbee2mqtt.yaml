apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: zigbee2mqtt
  namespace: flux-system
spec:
  dependsOn:
    - name: kaniop
    - name: kopiur-config
    - name: mosquitto
  interval: 10m
  path: ./manifests/prd/zigbee2mqtt
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m
  wait: true
