apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: actions-runners
  namespace: flux-system
spec:
  dependsOn:
    - name: external-secrets-config
    - name: actions-runner-controller
  interval: 10m
  path: ./manifests/prd/actions-runners
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m
  wait: true
