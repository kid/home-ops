apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: trust-manager-config
  namespace: flux-system
spec:
  dependsOn:
    - name: trust-manager
  interval: 10m
  path: ./manifests/prd/trust-manager-config
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m
  wait: true
