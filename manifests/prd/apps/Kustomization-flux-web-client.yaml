apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-web-client
  namespace: flux-system
spec:
  dependsOn:
    - name: kaniop
  interval: 10m
  path: ./manifests/prd/flux-web-client
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m
  wait: true
