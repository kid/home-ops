apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-web
  namespace: flux-system
spec:
  dependsOn:
    - name: flux-web-client
  interval: 10m
  path: ./manifests/prd/flux-web
  postBuild:
    substituteFrom:
      - kind: Secret
        name: flux-web-kanidm-oauth2-credentials
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m
  wait: true
