apiVersion: v1
data:
  alertmanager.yaml: '{"automation":[{"actions":[{"action":"timer.start","target":{"entity_id":"timer.alertmanager_watchdog"}}],"alias":"Alertmanager watchdog heartbeat","description":"Alertmanager''s Watchdog, every 5 minutes, restarts the 15-minute timer.","id":"alertmanager_watchdog_heartbeat","mode":"restart","triggers":[{"allowed_methods":["POST"],"local_only":false,"trigger":"webhook","webhook_id":!secret alertmanager_watchdog_webhook}]},{"actions":[{"action":"notify.mobile_app_arnauds_iphone","data":{"data":{"push":{"interruption-level":"time-sensitive"}},"message":"No Watchdog from Alertmanager for 15 minutes.","title":"Alertmanager heartbeat lost"}}],"alias":"Alertmanager watchdog lost","description":"No Watchdog from Alertmanager for 15 minutes.","id":"alertmanager_watchdog_lost","triggers":[{"event_data":{"entity_id":"timer.alertmanager_watchdog"},"event_type":"timer.finished","trigger":"event"}]},{"actions":[{"action":"notify.mobile_app_arnauds_iphone","data":{"data":{"apns_headers":{"apns-collapse-id":"{{ (trigger.json.commonLabels.alertname ~ ''-'' ~ (trigger.json.commonLabels.namespace | default(''''))) [:64] }}"},"push":{"interruption-level":"{{ ''time-sensitive'' if trigger.json.status == ''firing'' and trigger.json.commonLabels.severity == ''critical'' else ''active'' }}"},"tag":"{{ (trigger.json.commonLabels.alertname ~ ''-'' ~ (trigger.json.commonLabels.namespace | default(''''))) [:64] }}"},"message":"{{ trigger.json.commonAnnotations.summary | default(trigger.json.commonAnnotations.description, true) | default(trigger.json.commonLabels.namespace, true) | default('''', true) }}","title":"[{{ trigger.json.status | upper }}] {{ trigger.json.commonLabels.alertname }} ({{ trigger.json.alerts | length }})"}}],"alias":"Alertmanager alerts","description":"Critical and warning alerts from Alertmanager, one notification per alert group.","id":"alertmanager_alerts","mode":"queued","triggers":[{"allowed_methods":["POST"],"local_only":false,"trigger":"webhook","webhook_id":!secret alertmanager_alerts_webhook}]}],"timer":{"alertmanager_watchdog":{"duration":"00:15:00","icon":"mdi:heart-pulse","name":"Alertmanager watchdog","restore":true}}}'
kind: ConfigMap
metadata:
  name: alertmanager-homeassistant
  namespace: home-assistant
