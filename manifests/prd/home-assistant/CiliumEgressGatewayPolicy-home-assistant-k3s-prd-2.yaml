apiVersion: cilium.io/v2
kind: CiliumEgressGatewayPolicy
metadata:
  name: home-assistant-k3s-prd-2
spec:
  destinationCIDRs:
    - 10.0.50.0/24
    - 10.0.51.0/24
    - 10.0.100.0/24
    - 10.0.101.0/24
  egressGateway:
    egressIP: 10.0.40.22
    nodeSelector:
      matchLabels:
        kubernetes.io/hostname: k3s-prd-2
  selectors:
    - nodeSelector:
        matchLabels:
          kubernetes.io/hostname: k3s-prd-2
      podSelector:
        matchLabels:
          app.kubernetes.io/name: home-assistant
          io.kubernetes.pod.namespace: home-assistant
