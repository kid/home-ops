apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: home-assistant
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        checksum/alertmanager-package: cfd2116aff5c330965d6fba37c7326077584f57c884df811d7590650128c0409
      labels:
        app.kubernetes.io/name: home-assistant
    spec:
      automountServiceAccountToken: false
      containers:
        - image: ghcr.io/home-operations/home-assistant:2026.11.3@sha256:96c244d8aa3586026bb8d4fdc0dcf9b34f348874a1ea5060942356cf181177bc
          livenessProbe:
            httpGet:
              path: /manifest.json
              port: http
          name: home-assistant
          ports:
            - containerPort: 8123
              name: http
          resources:
            limits:
              memory: 2Gi
            requests:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          startupProbe:
            failureThreshold: 60
            httpGet:
              path: /manifest.json
              port: http
            periodSeconds: 10
          volumeMounts:
            - mountPath: /config
              name: config
            - mountPath: /config/packages
              name: packages
              readOnly: true
            - mountPath: /tmp
              name: tmp
      securityContext:
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 120
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: home-assistant
        - name: packages
          projected:
            sources:
              - configMap:
                  name: alertmanager-homeassistant
              - secret:
                  name: alertmanager-homeassistant
        - emptyDir: {}
          name: tmp
