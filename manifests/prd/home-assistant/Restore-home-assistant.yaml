apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  credentialProjection:
    enabled: true
  mover:
    privilegedMode: true
    securityContext:
      runAsGroup: 0
      runAsNonRoot: false
      runAsUser: 0
  policy:
    onMissingSnapshot: Continue
  repository:
    kind: ClusterRepository
    name: local
  source:
    identity:
      hostname: home-assistant-full
      sourcePath: /pvc/home-assistant
      username: home-assistant-full
  target:
    populator: {}
