apiVersion: cilium.io/v2
kind: CiliumEgressGatewayPolicy
metadata:
  name: home-assistant
spec:
  destinationCIDRs:
    - 10.0.50.0/24
    - 10.0.51.0/24
    - 10.0.100.0/24
    - 10.0.101.0/24
  egressGateway:
    egressIP: 10.0.40.20
    nodeSelector:
      matchLabels:
        kubernetes.io/hostname: k3s-prd-0
  selectors:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: home-assistant
          io.kubernetes.pod.namespace: home-assistant
