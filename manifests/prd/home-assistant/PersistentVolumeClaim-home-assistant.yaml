apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  accessModes:
    - ReadWriteOncePod
  dataSourceRef:
    apiGroup: kopiur.home-operations.com
    kind: Restore
    name: home-assistant
  resources:
    requests:
      storage: 5Gi
  storageClassName: miroir-replicated
