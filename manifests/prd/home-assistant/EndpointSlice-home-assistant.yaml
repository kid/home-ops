addressType: IPv4
apiVersion: discovery.k8s.io/v1
endpoints:
  - addresses:
      - 10.0.10.101
    conditions:
      ready: true
kind: EndpointSlice
metadata:
  labels:
    endpointslice.kubernetes.io/managed-by: home-ops
    kubernetes.io/service-name: home-assistant
  name: home-assistant
  namespace: home-assistant
ports:
  - appProtocol: kubernetes.io/ws
    name: http
    port: 8123
    protocol: TCP
