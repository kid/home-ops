apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-homeassistant
  namespace: home-assistant
spec:
  data:
    - remoteRef:
        key: alertmanager-ha-alerts-webhook/credentials/webhook-id
      secretKey: alerts
    - remoteRef:
        key: alertmanager-ha-watchdog-webhook/credentials/webhook-id
      secretKey: watchdog
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: alertmanager-homeassistant
    template:
      data:
        secrets.yaml: '{"alertmanager_alerts_webhook":"{{ .alerts }}","alertmanager_watchdog_webhook":"{{ .watchdog }}"}'
