apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/instance: kopiur
    app.kubernetes.io/name: kopiur
    app.kubernetes.io/part-of: kopiur
  name: kopiur-central-mover
rules:
  - apiGroups:
      - kopiur.home-operations.com
    resources:
      - snapshots/status
      - restores/status
      - snapshotpolicies/status
    verbs:
      - get
      - patch
