apiVersion: v1
kind: Service
metadata:
  annotations:
    external-dns.kubernetes.io/hostname: kube.kidibox.net
  name: kube-api
  namespace: default
spec:
  externalTrafficPolicy: Local
  ports:
    - name: https
      port: 6443
      protocol: TCP
      targetPort: 6443
  selector:
    app.kubernetes.io/name: kube-api
  type: LoadBalancer
