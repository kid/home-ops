apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: prowlarr
  namespace: media
spec:
  credentialProjection:
    enabled: true
  mover:
    privilegedMode: true
    securityContext:
      runAsGroup: 0
      runAsNonRoot: false
      runAsUser: 0
  policy:
    onMissingSnapshot: Fail
  repository:
    kind: ClusterRepository
    name: local
  source:
    identity:
      hostname: prowlarr-full
      sourcePath: /pvc/prowlarr
      username: prowlarr-full
  target:
    populator: {}
