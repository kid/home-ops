apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: prowlarr-api-key
  namespace: media
spec:
  data:
    - remoteRef:
        key: prowlarr-api-key/credentials/api-key
      secretKey: api-key
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: prowlarr-api-key
