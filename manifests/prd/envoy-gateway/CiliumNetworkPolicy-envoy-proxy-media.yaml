apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: envoy-proxy-media
  namespace: envoy-gateway-system
spec:
  egress:
    - toCIDR:
        - 10.0.30.110/32
      toPorts:
        - ports:
            - port: "9696"
              protocol: TCP
    - toCIDR:
        - 10.0.30.120/32
      toPorts:
        - ports:
            - port: "7878"
              protocol: TCP
    - toCIDR:
        - 10.0.30.150/32
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toCIDR:
        - 10.0.30.130/32
      toPorts:
        - ports:
            - port: "8989"
              protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: envoy
