apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: envoy-oidc-hmac
  namespace: envoy-gateway-system
spec:
  data:
    - remoteRef:
        key: envoy-oidc-hmac/credentials/hmac-secret
      secretKey: hmac-secret
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: envoy-oidc-hmac
