apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app: openebs-zfs-node
    chart: zfs-localpv-2.10.1
    heritage: Helm
    name: openebs-zfs-node
    openebs.io/component-name: openebs-zfs-node
    openebs.io/version: 2.10.1
    release: openebs
    role: openebs-zfs
  name: openebs-zfs-localpv-node
  namespace: openebs
spec:
  selector:
    matchLabels:
      name: openebs-zfs-node
      release: openebs
  template:
    metadata:
      labels:
        app: openebs-zfs-node
        chart: zfs-localpv-2.10.1
        heritage: Helm
        name: openebs-zfs-node
        openebs.io/component-name: openebs-zfs-node
        openebs.io/logging: "true"
        openebs.io/version: 2.10.1
        release: openebs
        role: openebs-zfs
    spec:
      containers:
        - args:
            - --v=5
            - --csi-address=$(ADDRESS)
            - --kubelet-registration-path=$(DRIVER_REG_SOCK_PATH)
          env:
            - name: ADDRESS
              value: /plugin/csi.sock
            - name: DRIVER_REG_SOCK_PATH
              value: /var/lib/kubelet/plugins/zfs-localpv/csi.sock
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NODE_DRIVER
              value: openebs-zfs
          image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.13.0
          imagePullPolicy: IfNotPresent
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - rm -rf /registration/zfs-localpv /registration/zfs-localpv-reg.sock
          name: csi-node-driver-registrar
          resources: {}
          volumeMounts:
            - mountPath: /plugin
              name: plugin-dir
            - mountPath: /registration
              name: registration-dir
        - args:
            - --nodename=$(OPENEBS_NODE_NAME)
            - --endpoint=$(OPENEBS_CSI_ENDPOINT)
            - --plugin=$(OPENEBS_NODE_DRIVER)
          env:
            - name: OPENEBS_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: OPENEBS_CSI_ENDPOINT
              value: unix:///plugin/csi.sock
            - name: OPENEBS_NODE_DRIVER
              value: agent
            - name: OPENEBS_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ALLOWED_TOPOLOGIES
              value: All
          image: docker.io/openebs/zfs-driver:2.10.1
          imagePullPolicy: IfNotPresent
          name: openebs-zfs-plugin
          resources: {}
          securityContext:
            allowPrivilegeEscalation: true
            privileged: true
          volumeMounts:
            - mountPath: /plugin
              name: plugin-dir
            - mountPath: /dev
              name: device-dir
            - mountPath: /home/keys
              name: encr-keys
            - mountPath: /sbin/zfs
              name: chroot-zfs
              subPath: zfs
            - mountPath: /host
              mountPropagation: HostToContainer
              name: host-root
              readOnly: true
            - mountPath: /var/lib/kubelet/
              mountPropagation: Bidirectional
              name: pods-mount-dir
      hostNetwork: true
      priorityClassName: openebs-zfs-csi-node-critical
      serviceAccountName: openebs-zfs-node-sa
      volumes:
        - hostPath:
            path: /dev
            type: Directory
          name: device-dir
        - hostPath:
            path: /home/keys
            type: DirectoryOrCreate
          name: encr-keys
        - configMap:
            defaultMode: 365
            name: openebs-zfspv-bin
          name: chroot-zfs
        - hostPath:
            path: /
            type: Directory
          name: host-root
        - hostPath:
            path: /var/lib/kubelet/plugins_registry/
            type: DirectoryOrCreate
          name: registration-dir
        - hostPath:
            path: /var/lib/kubelet/plugins/zfs-localpv/
            type: DirectoryOrCreate
          name: plugin-dir
        - hostPath:
            path: /var/lib/kubelet/
            type: Directory
          name: pods-mount-dir
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 100%
    type: RollingUpdate
