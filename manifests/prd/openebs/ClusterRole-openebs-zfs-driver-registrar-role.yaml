apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app: openebs-zfs-node
    chart: zfs-localpv-2.10.1
    heritage: Helm
    name: openebs-zfs-node
    openebs.io/component-name: openebs-zfs-node
    openebs.io/version: 2.10.1
    release: openebs
    role: openebs-zfs
  name: openebs-zfs-driver-registrar-role
rules:
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
  - apiGroups:
      - ""
    resources:
      - persistentvolumes
      - nodes
      - services
    verbs:
      - get
      - list
  - apiGroups:
      - '*'
    resources:
      - zfsvolumes
      - zfssnapshots
      - zfsbackups
      - zfsrestores
      - zfsnodes
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
