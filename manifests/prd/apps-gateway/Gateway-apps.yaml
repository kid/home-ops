apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: apps
  namespace: gateway
spec:
  gatewayClassName: cilium
  listeners:
    - allowedRoutes:
        namespaces:
          from: All
      hostname: '*.kidibox.net'
      name: https
      port: 443
      protocol: HTTPS
      tls:
        certificateRefs:
          - name: apps-tls
        mode: Terminate
