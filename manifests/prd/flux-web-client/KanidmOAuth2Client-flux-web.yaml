apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: flux-web
  namespace: flux-system
spec:
  displayname: Flux
  kanidmRef:
    name: idm
    namespace: kanidm
  origin: https://flux.kidibox.net
  preferShortUsername: true
  redirectUrl:
    - https://flux.kidibox.net/oauth2/callback
  scopeMap:
    - group: admins
      scopes:
        - openid
        - profile
        - email
        - groups_name
