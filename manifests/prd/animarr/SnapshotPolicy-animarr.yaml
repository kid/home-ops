apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: animarr
  namespace: media
spec:
  credentialProjection:
    enabled: true
  files:
    ignoreRules:
      - /lost+found
      - /MediaCover
      - /Definitions
      - /Backups
      - /Sentry
      - /UpdateLogs
      - /logs
      - /logs.db*
  identity:
    hostname: animarr
    username: animarr
  mover:
    resources:
      requests:
        cpu: 50m
        memory: 192Mi
    securityContext:
      runAsGroup: 100350
      runAsUser: 100350
  repository:
    kind: ClusterRepository
    name: r2
  retention:
    keepDaily: 14
    keepWeekly: 4
  sources:
    - pvc:
        name: animarr
