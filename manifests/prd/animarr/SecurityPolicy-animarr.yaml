apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: animarr
  namespace: media
spec:
  oidc:
    clientID: animarr
    clientSecret:
      name: animarr-kanidm-oauth2-credentials
    denyRedirect:
      headers:
        - name: Sec-Fetch-Mode
          type: RegularExpression
          value: cors|no-cors|same-origin|websocket
    logoutPath: /oauth2/logout
    provider:
      authorizationEndpoint: https://idm.kidibox.net/ui/oauth2
      issuer: https://idm.kidibox.net/oauth2/openid/animarr
      tokenEndpoint: https://idm.kidibox.net/oauth2/token
    redirectURL: https://animarr.kidibox.net/oauth2/callback
    scopes:
      - openid
      - profile
      - email
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: animarr
