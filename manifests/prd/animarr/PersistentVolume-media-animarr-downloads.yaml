apiVersion: v1
kind: PersistentVolume
metadata:
  name: media-animarr-downloads
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 1Gi
  claimRef:
    name: animarr-downloads
    namespace: media
  hostPath:
    path: /tank/downloads/sabnzbd
    type: Directory
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
