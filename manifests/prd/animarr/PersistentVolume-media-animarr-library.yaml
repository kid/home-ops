apiVersion: v1
kind: PersistentVolume
metadata:
  name: media-animarr-library
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 1Gi
  claimRef:
    name: animarr-library
    namespace: media
  hostPath:
    path: /tank/library/animes
    type: Directory
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
