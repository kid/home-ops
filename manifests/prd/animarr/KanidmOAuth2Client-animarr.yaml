apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: animarr
  namespace: media
spec:
  disableConsentPrompt: true
  displayname: animarr
  kanidmRef:
    name: idm
    namespace: kanidm
  origin: https://animarr.kidibox.net
  redirectUrl:
    - https://animarr.kidibox.net/oauth2/callback
  refreshTokenExpiry: 604800
  scopeMap:
    - group: media
      scopes:
        - openid
        - profile
        - email
  secretKeyAliases:
    clientSecret:
      - client-secret
