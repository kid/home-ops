apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: animarr
  namespace: media
spec:
  hostnames:
    - animarr.kidibox.net
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: apps
      namespace: envoy-gateway-system
      sectionName: https
  rules:
    - backendRefs:
        - name: animarr
          port: 8989
