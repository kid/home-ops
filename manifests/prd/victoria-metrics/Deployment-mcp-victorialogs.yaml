apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-victorialogs
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-victorialogs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-victorialogs
    spec:
      automountServiceAccountToken: false
      containers:
        - env:
            - name: MCP_LISTEN_ADDR
              value: :8080
            - name: MCP_SERVER_MODE
              value: http
            - name: VL_INSTANCE_ENTRYPOINT
              value: http://vlsingle-victoria-metrics.monitoring.svc:9428
          image: ghcr.io/victoriametrics/mcp-victorialogs:1.9.0@sha256:753bb4fbe402ca1a782842f44636830f9895736f11d7fe783b924f8a0daf083d
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: http
          name: mcp-victorialogs
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
