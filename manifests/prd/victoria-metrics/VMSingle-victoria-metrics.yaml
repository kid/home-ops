apiVersion: operator.victoriametrics.com/v1beta1
kind: VMSingle
metadata:
  labels:
    app.kubernetes.io/component: vmsingle
    app.kubernetes.io/instance: victoria-metrics
    app.kubernetes.io/name: victoria-metrics-k8s-stack
  name: victoria-metrics
  namespace: monitoring
spec:
  extraArgs:
    vmalert.proxyURL: http://vmalert-victoria-metrics.monitoring.svc.cluster.local.:8080
  image:
    tag: v1.157.0
  logFormat: json
  port: "8428"
  replicaCount: 1
  resources:
    limits:
      memory: 2Gi
    requests:
      cpu: 200m
      memory: 1536Mi
  retentionPeriod: 30d
  storage:
    accessModes:
      - ReadWriteOncePod
    dataSourceRef:
      apiGroup: kopiur.home-operations.com
      kind: Restore
      name: vmsingle-victoria-metrics
    resources:
      requests:
        storage: 10Gi
    storageClassName: zfs
