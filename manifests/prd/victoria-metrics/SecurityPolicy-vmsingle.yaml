apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: vmsingle
  namespace: monitoring
spec:
  oidc:
    clientID: vmsingle
    clientSecret:
      name: vmsingle-kanidm-oauth2-credentials
    logoutPath: /oauth2/logout
    provider:
      issuer: https://idm.kidibox.net/oauth2/openid/vmsingle
    redirectURL: https://metrics.kidibox.net/oauth2/callback
    scopes:
      - openid
      - profile
      - email
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: vmsingle-victoria-metrics
