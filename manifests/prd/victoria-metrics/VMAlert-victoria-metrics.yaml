apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlert
metadata:
  labels:
    app.kubernetes.io/component: vmalert
    app.kubernetes.io/instance: victoria-metrics
    app.kubernetes.io/name: victoria-metrics-k8s-stack
  name: victoria-metrics
  namespace: monitoring
spec:
  configMaps: []
  configReloaderExtraArgs:
    loggerFormat: json
  datasource:
    url: http://vmauth-victoria-metrics-internal.monitoring.svc.cluster.local.:8427
  evaluationInterval: 20s
  externalLabels: {}
  extraArgs:
    external.alert.source: explore?schemaVersion=1&orgId=1&panes=%7B%22alert%22%3A%7B%22datasource%22%3A%22vm-metrics%22%2C%22queries%22%3A%5B%7B%22datasource%22%3A%7B%22type%22%3A%22victoriametrics-metrics-datasource%22%2C%22uid%22%3A%22vm-metrics%22%7D%2C%22expr%22%3A{{ .Expr|jsonEscape|queryEscape }}%2C%22refId%22%3A%22A%22%7D%5D%2C%22range%22%3A%7B%22from%22%3A%22{{ .ActiveAt.UnixMilli }}%22%2C%22to%22%3A%22now%22%7D%7D%7D
    external.url: https://grafana.kidibox.net
    http.pathPrefix: /
    remoteWrite.disablePathAppend: "true"
  image:
    tag: v1.157.0
  logFormat: json
  notifiers:
    - url: http://vmalertmanager-victoria-metrics-0.vmalertmanager-victoria-metrics.monitoring.svc.cluster.local.:9093
  port: "8080"
  remoteRead:
    url: http://vmsingle-victoria-metrics.monitoring.svc.cluster.local.:8428
  remoteWrite:
    url: http://vmsingle-victoria-metrics.monitoring.svc.cluster.local.:8428/api/v1/write
  resources:
    limits:
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi
  selectAllByDefault: true
