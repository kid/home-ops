apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-victoriametrics-metadata
  namespace: monitoring
spec:
  hostnames:
    - metrics.kidibox.net
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: apps
      namespace: envoy-gateway-system
      sectionName: https
  rules:
    - filters:
        - extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: mcp-victoriametrics-metadata-mcp
          type: ExtensionRef
      matches:
        - path:
            type: Exact
            value: /.well-known/oauth-protected-resource/mcp
      name: mcp
    - filters:
        - extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: mcp-victoriametrics-metadata-root
          type: ExtensionRef
      matches:
        - path:
            type: Exact
            value: /.well-known/oauth-protected-resource
      name: root
