apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/force: Enabled
  labels:
    app.kubernetes.io/component: syncJob
    app.kubernetes.io/instance: victoria-metrics
    app.kubernetes.io/name: victoria-metrics-k8s-stack
  name: victoria-metrics-sync-job
  namespace: monitoring
spec:
  backoffLimit: 3
  template:
    metadata:
      annotations:
        checksum/config: 55518f52ad857473338250d3103ba9ad2912ff173b2c0752705db87dadf0f447
      labels:
        app.kubernetes.io/component: syncJob
        app.kubernetes.io/instance: victoria-metrics
        app.kubernetes.io/name: victoria-metrics-k8s-stack
    spec:
      containers:
        - env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: RELEASE
              value: victoria-metrics
            - name: RESOURCE_PREFIX
              value: victoria-metrics
            - name: PRUNE
              value: "true"
            - name: OWNER_REFERENCES
              value: "true"
            - name: SERVICE_ACCOUNT
              valueFrom:
                fieldRef:
                  fieldPath: spec.serviceAccountName
          image: ghcr.io/victoriametrics/sync-job:v0.0.17
          imagePullPolicy: IfNotPresent
          name: sync-job
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
          volumeMounts:
            - mountPath: /etc/config
              name: config
              readOnly: true
      restartPolicy: OnFailure
      serviceAccountName: victoria-metrics-sync-job
      volumes:
        - configMap:
            name: victoria-metrics-sync-job-config
          name: config
