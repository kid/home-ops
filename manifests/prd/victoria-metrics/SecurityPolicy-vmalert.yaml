apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: vmalert
  namespace: monitoring
spec:
  oidc:
    clientID: vmalert
    clientSecret:
      name: vmalert-kanidm-oauth2-credentials
    logoutPath: /oauth2/logout
    provider:
      authorizationEndpoint: https://idm.kidibox.net/ui/oauth2
      issuer: https://idm.kidibox.net/oauth2/openid/vmalert
      tokenEndpoint: https://idm.kidibox.net/oauth2/token
    redirectURL: https://vmalert.kidibox.net/oauth2/callback
    scopes:
      - openid
      - profile
      - email
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: vmalert-victoria-metrics
