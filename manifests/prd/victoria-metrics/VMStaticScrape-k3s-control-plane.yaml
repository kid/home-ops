apiVersion: operator.victoriametrics.com/v1beta1
kind: VMStaticScrape
metadata:
  name: k3s-control-plane
  namespace: monitoring
spec:
  targetEndpoints:
    - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      labels:
        job: kube-scheduler
      max_scrape_size: 64MiB
      metricRelabelConfigs:
        - action: keep
          regex: (scheduler|rest_client|process|go)_.*
          sourceLabels:
            - __name__
      scheme: https
      targets:
        - 10.0.40.10:10259
      tlsConfig:
        insecureSkipVerify: true
    - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      labels:
        job: kube-controller-manager
      max_scrape_size: 64MiB
      metricRelabelConfigs:
        - action: keep
          regex: (workqueue|node_collector|garbagecollector|pv_collector|[a-z_]+_controller|root_ca_cert_publisher|rest_client|process|go)_.*
          sourceLabels:
            - __name__
      scheme: https
      targets:
        - 10.0.40.10:10257
      tlsConfig:
        insecureSkipVerify: true
    - labels:
        job: kube-etcd
      targets:
        - 10.0.40.10:2381
