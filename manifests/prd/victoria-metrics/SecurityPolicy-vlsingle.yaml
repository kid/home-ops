apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: vlsingle
  namespace: monitoring
spec:
  oidc:
    clientID: vlsingle
    clientSecret:
      name: vlsingle-kanidm-oauth2-credentials
    logoutPath: /oauth2/logout
    provider:
      authorizationEndpoint: https://idm.kidibox.net/ui/oauth2
      issuer: https://idm.kidibox.net/oauth2/openid/vlsingle
      tokenEndpoint: https://idm.kidibox.net/oauth2/token
    redirectURL: https://logs.kidibox.net/oauth2/callback
    scopes:
      - openid
      - profile
      - email
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: vlsingle-victoria-metrics
