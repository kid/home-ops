apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: vlsingle
  namespace: monitoring
spec:
  authorization:
    defaultAction: Deny
    rules:
      - action: Allow
        principal:
          clientCIDRs:
            - 10.0.100.0/24
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: vlsingle-victoria-metrics
