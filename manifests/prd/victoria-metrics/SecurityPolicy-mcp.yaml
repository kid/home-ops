apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: mcp
  namespace: monitoring
spec:
  jwt:
    providers:
      - audiences:
          - mcp
        issuer: https://idm.kidibox.net/oauth2/openid/mcp
        name: kanidm
        remoteJWKS:
          uri: https://idm.kidibox.net/oauth2/openid/mcp/public_key.jwk
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: mcp-victorialogs
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: mcp-victoriametrics
