apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: victoria-logs
  namespace: monitoring
spec:
  datasource:
    access: proxy
    name: VictoriaLogs
    type: victoriametrics-logs-datasource
    url: http://vlsingle-victoria-metrics.monitoring.svc:9428
  instanceSelector:
    matchLabels:
      dashboards: grafana
