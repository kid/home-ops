apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaManifest
metadata:
  name: pod-logs-prometheus
  namespace: monitoring
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  template:
    apiVersion: correlations.grafana.app/v0alpha1
    kind: Correlation
    metadata:
      name: pod-logs-prometheus
    spec:
      config:
        field: pod
        target:
          expr: k8s.namespace.name:="${namespace}" AND k8s.pod.name:="${pod}"
          queryType: instant
      description: This pod's logs in VictoriaLogs
      label: Pod logs
      source:
        group: prometheus
        name: VictoriaMetrics
      target:
        group: victoriametrics-logs-datasource
        name: vm-logs
      type: query
