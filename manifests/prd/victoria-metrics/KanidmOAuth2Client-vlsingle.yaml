apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: vlsingle
  namespace: monitoring
spec:
  disableConsentPrompt: true
  displayname: vlsingle
  kanidmRef:
    name: idm
    namespace: kanidm
  origin: https://logs.kidibox.net
  redirectUrl:
    - https://logs.kidibox.net/oauth2/callback
  scopeMap:
    - group: admins
      scopes:
        - openid
        - profile
        - email
  secretKeyAliases:
    clientSecret:
      - client-secret
