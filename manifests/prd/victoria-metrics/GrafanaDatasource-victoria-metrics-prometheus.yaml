apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: victoria-metrics-prometheus
  namespace: monitoring
spec:
  datasource:
    access: proxy
    isDefault: false
    jsonData:
      timeInterval: 30s
    name: Prometheus
    type: prometheus
    uid: VictoriaMetrics
    url: http://vmsingle-victoria-metrics.monitoring.svc:8428/prometheus
  instanceSelector:
    matchLabels:
      dashboards: grafana
