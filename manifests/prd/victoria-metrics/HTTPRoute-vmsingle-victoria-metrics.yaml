apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vmsingle-victoria-metrics
  namespace: monitoring
spec:
  hostnames:
    - metrics.kidibox.net
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: apps
      namespace: envoy-gateway-system
      sectionName: https
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: vmsingle-victoria-metrics
          port: 8428
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
      name: app
    - backendRefs:
        - group: ""
          kind: Service
          name: mcp-victoriametrics
          port: 8080
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /mcp
      name: mcp
    - filters:
        - extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: mcp-victoriametrics-metadata-mcp
          type: ExtensionRef
      matches:
        - path:
            type: Exact
            value: /.well-known/oauth-protected-resource/mcp
      name: mcp-metadata-mcp
    - filters:
        - extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: mcp-victoriametrics-metadata-root
          type: ExtensionRef
      matches:
        - path:
            type: Exact
            value: /.well-known/oauth-protected-resource
      name: mcp-metadata-root
