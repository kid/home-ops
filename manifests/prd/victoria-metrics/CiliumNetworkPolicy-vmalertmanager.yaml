apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vmalertmanager
  namespace: monitoring
spec:
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    - toCIDR:
        - 10.0.10.101/32
      toPorts:
        - ports:
            - port: "8123"
              protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: vmalertmanager
