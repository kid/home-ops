apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-victorialogs
  namespace: monitoring
spec:
  hostnames:
    - mcp-logs.kidibox.net
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: apps
      namespace: envoy-gateway-system
      sectionName: https
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: mcp-victorialogs
          port: 8080
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
