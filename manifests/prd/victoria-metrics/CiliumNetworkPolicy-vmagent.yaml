apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vmagent
  namespace: monitoring
spec:
  egress:
    - toEntities:
        - cluster
    - toCIDR:
        - 10.0.10.10/32
      toPorts:
        - ports:
            - port: "9100"
              protocol: TCP
    - toCIDR:
        - 10.0.10.11/32
      toPorts:
        - ports:
            - port: "9100"
              protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: vmagent
