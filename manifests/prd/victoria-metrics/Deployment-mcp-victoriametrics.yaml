apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-victoriametrics
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-victoriametrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-victoriametrics
    spec:
      automountServiceAccountToken: false
      containers:
        - env:
            - name: MCP_LISTEN_ADDR
              value: :8080
            - name: MCP_SERVER_MODE
              value: http
            - name: VM_INSTANCE_ENTRYPOINT
              value: http://vmsingle-victoria-metrics.monitoring.svc:8428
            - name: VM_INSTANCE_TYPE
              value: single
          image: ghcr.io/victoriametrics/mcp-victoriametrics:1.20.2@sha256:bcbf84f945d6efb03fb8b2d2ccc3294420dccdc0b445752dce96f02619416dfe
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: http
          name: mcp-victoriametrics
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
