apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-victoriametrics
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-victoriametrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-victoriametrics
    spec:
      automountServiceAccountToken: false
      containers:
        - env:
            - name: MCP_DISABLED_TOOLS
              value: export,flags,metric_relabel_debug,downsampling_filters_debug,retention_filters_debug,test_rules,documentation
            - name: MCP_LISTEN_ADDR
              value: :8080
            - name: MCP_SERVER_MODE
              value: http
            - name: VM_INSTANCE_ENTRYPOINT
              value: http://vmsingle-victoria-metrics.monitoring.svc:8428
            - name: VM_INSTANCE_TYPE
              value: single
          image: ghcr.io/victoriametrics/mcp-victoriametrics:v1.120.1@sha256:16d9a30a6629319a8e84a73b9b54e1e9b9e5bf229bc40a7f1717c8602b0c1c09
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: http
          name: mcp-victoriametrics
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
