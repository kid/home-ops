apiVersion: v1
kind: Secret
metadata:
  labels:
    app.kubernetes.io/component: alertmanager
    app.kubernetes.io/instance: victoria-metrics
    app.kubernetes.io/name: victoria-metrics-k8s-stack
  name: vmalertmanager-victoria-metrics
  namespace: monitoring
stringData:
  alertmanager.yaml: |
    inhibit_rules:
    - equal:
      - alertname
      - namespace
      source_matchers:
      - severity="critical"
      target_matchers:
      - severity="warning"
    receivers:
    - name: blackhole
    - name: homeassistant
      webhook_configs:
      - send_resolved: true
        url_file: /etc/vm/secrets/alertmanager-homeassistant/alerts
    - name: ha-watchdog
      webhook_configs:
      - send_resolved: false
        url_file: /etc/vm/secrets/alertmanager-homeassistant/watchdog
    route:
      group_by:
      - alertname
      - namespace
      receiver: blackhole
      routes:
      - group_interval: 1m
        group_wait: 0s
        matchers:
        - alertname="Watchdog"
        receiver: ha-watchdog
        repeat_interval: 5m
      - matchers:
        - severity=~"critical|warning"
        receiver: homeassistant
    templates:
    - /etc/vm/templates/**/*.tmpl
