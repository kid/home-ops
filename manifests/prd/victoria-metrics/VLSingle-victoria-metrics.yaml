apiVersion: operator.victoriametrics.com/v1
kind: VLSingle
metadata:
  labels:
    app.kubernetes.io/component: vlsingle
    app.kubernetes.io/instance: victoria-metrics
    app.kubernetes.io/name: victoria-metrics-k8s-stack
  name: victoria-metrics
  namespace: monitoring
spec:
  extraArgs:
    vmalert.proxyURL: http://vmalert-victoria-metrics.monitoring.svc.cluster.local.:8080
  image:
    tag: v1.54.0
  logFormat: json
  port: "9428"
  replicaCount: 1
  resources:
    limits:
      memory: 1Gi
    requests:
      cpu: 10m
      memory: 512Mi
  retentionPeriod: 30d
  storage:
    accessModes:
      - ReadWriteOncePod
    dataSourceRef:
      apiGroup: kopiur.home-operations.com
      kind: Restore
      name: vlsingle-victoria-metrics
    resources:
      requests:
        storage: 5Gi
    storageClassName: zfs
