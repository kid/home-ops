apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: alertmanager-homeassistant
  namespace: monitoring
spec:
  data:
    - remoteRef:
        key: alertmanager-homeassistant/alerts-webhook-id
      secretKey: alerts
    - remoteRef:
        key: alertmanager-homeassistant/watchdog-webhook-id
      secretKey: watchdog
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: alertmanager-homeassistant
    template:
      data:
        alerts: http://10.0.10.101:8123/api/webhook/{{ .alerts }}
        watchdog: http://10.0.10.101:8123/api/webhook/{{ .watchdog }}
