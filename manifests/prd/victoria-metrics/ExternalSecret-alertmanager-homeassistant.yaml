apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-homeassistant
  namespace: monitoring
spec:
  data:
    - remoteRef:
        key: alertmanager-ha-alerts-webhook/credentials/webhook-id
      secretKey: alerts
    - remoteRef:
        key: alertmanager-ha-watchdog-webhook/credentials/webhook-id
      secretKey: watchdog
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: alertmanager-homeassistant
    template:
      data:
        alerts: http://home-assistant.home-assistant.svc:8123/api/webhook/{{ .alerts }}
        watchdog: http://home-assistant.home-assistant.svc:8123/api/webhook/{{ .watchdog }}
