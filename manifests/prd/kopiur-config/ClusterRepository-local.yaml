apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: local
spec:
  allowedNamespaces:
    all: true
  backend:
    filesystem:
      path: /repo
      volume:
        nfs:
          path: /srv/clusters/prd/apps/kopiur-local
          server: 10.0.20.10
  create:
    enabled: true
  credentialProjection:
    allowed: true
  encryption:
    passwordSecretRef:
      key: KOPIA_PASSWORD
      name: kopiur-r2
      namespace: kopiur-system
  moverDefaults:
    securityContext:
      runAsGroup: 65534
      runAsUser: 65534
  parameters:
    epoch:
      minDuration: 6h
