apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: authelia
  namespace: authelia
spec:
  credentialProjection:
    enabled: true
  identity:
    hostname: authelia
    username: authelia
  mover:
    resources:
      requests:
        cpu: 50m
        memory: 192Mi
    securityContext:
      runAsGroup: 1000
      runAsUser: 1000
  repository:
    kind: ClusterRepository
    name: r2
  retention:
    keepDaily: 14
    keepWeekly: 4
  sources:
    - pvc:
        name: authelia
