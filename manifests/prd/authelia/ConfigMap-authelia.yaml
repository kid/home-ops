apiVersion: v1
data:
  configuration.yaml: "---\n# yaml-language-server: $schema=https://www.authelia.com/schemas/v4.39/json-schema/configuration.json\ntheme: 'light'\ndefault_2fa_method: ''\nserver:\n  address: 'tcp://0.0.0.0:9091/'\n  asset_path: ''\n  headers:\n    csp_template: \"\"\n  buffers:\n    read: 4096\n    write: 4096\n  timeouts:\n    read: '6 seconds'\n    write: '6 seconds'\n    idle: '30 seconds'\n  endpoints:\n    enable_pprof: false\n    enable_expvars: false\n    authz:\n      auth-request:\n        implementation: 'AuthRequest'\n      ext-authz:\n        implementation: 'ExtAuthz'\n      forward-auth:\n        implementation: 'ForwardAuth'\n    rate_limits:\n      reset_password_start:\n        enable: true\n      reset_password_finish:\n        enable: true\n      second_factor_totp:\n        enable: true\n      second_factor_duo:\n        enable: true\n      session_elevation_start:\n        enable: true\n      session_elevation_finish:\n        enable: true\n      openid_connect_token:\n        enable: true\n      openid_connect_pushed_authorization_request:\n        enable: true\n      openid_connect_userinfo:\n        enable: true\n      openid_connect_introspection:\n        enable: true\n      openid_connect_revocation:\n        enable: true\n      second_factor_password:\n        enable: true\nlog:\n  level: 'info'\n  format: 'text'\n  file_path: ''\n  keep_stdout: true\ntelemetry:\n  metrics:\n    enabled: true\n    address: 'tcp://0.0.0.0:9959'\n    buffers:\n      read: 4096\n      write: 4096\n    timeouts:\n      read: '6 seconds'\n      write: '6 seconds'\n      idle: '30 seconds'\nidentity_validation:\n  elevated_session:\n    code_lifespan: '5 minutes'\n    elevation_lifespan: '10 minutes'\n    characters: 8\n    require_second_factor: false\n    skip_second_factor: false\n  reset_password:\n    jwt_lifespan: '5 minutes'\n    jwt_algorithm: 'HS256'\ntotp:\n  disable: false\n  issuer: 'Authelia'\n  skew: 1\n  secret_size: 32\n  algorithm: 'SHA1'\n  digits: 6\n  period: 30\n  disable_reuse_security_policy: false\n  allowed_algorithms:\n    - 'SHA1'\n  allowed_digits:\n    - 6\n  allowed_periods:\n    - 30\nwebauthn:\n  disable: false\n  enable_passkey_login: false\n  experimental_enable_passkey_uv_two_factors: false\n  experimental_enable_passkey_upgrade: false\n  display_name: 'Authelia'\n  attestation_conveyance_preference: 'indirect'\n  timeout: '60 seconds'\n  filtering:\n    permitted_aaguids: []\n    prohibited_aaguids: []\n    prohibit_backup_eligibility: false\n  selection_criteria:\n    attachment: ''\n    discoverability: 'preferred'\n    user_verification: 'preferred'\n  metadata:\n    enabled: false\n    cache_policy: 'strict'\n    validate_trust_anchor: true\n    validate_entry: true\n    validate_entry_permit_zero_aaguid: false\n    validate_status: true\n    validate_status_permitted: []\n    validate_status_prohibited: []\nntp:\n  address: 'udp://time.cloudflare.com:123'\n  version: 4\n  max_desync: '3 seconds'\n  disable_startup_check: false\n  disable_failure: false\nauthentication_backend:\n  password_reset:\n    disable: true\n    custom_url: ''\n  password_change:\n    disable: true\n  refresh_interval: '5 minutes'\n  file:\n    path: '/secrets/authelia-extra/users_database.yml'\n    watch: false\n    search:\n      email: false\n      case_insensitive: false\n    password:\n      algorithm: 'argon2'\n      argon2:\n        variant: 'argon2id'\n        iterations: 3\n        memory: 65536\n        parallelism: 4\n        key_length: 32\n        salt_length: 16\n      scrypt:\n        variant: 'scrypt'\n        iterations: 16\n        block_size: 8\n        parallelism: 1\n        key_length: 32\n        salt_length: 16\n      pbkdf2:\n        variant: 'sha512'\n        iterations: 310000\n        salt_length: 16\n      sha2crypt:\n        variant: 'sha512'\n        iterations: 50000\n        salt_length: 16\n      bcrypt:\n        variant: 'standard'\n        cost: 12\npassword_policy:\n  standard:\n    enabled: false\n    min_length: 8\n    max_length: 0\n    require_uppercase: false\n    require_lowercase: false\n    require_number: false\n    require_special: false\n  zxcvbn:\n    enabled: false\n    min_score: 0\nsession:\n  name: 'authelia_session'\n  same_site: 'lax'\n  inactivity: '1 week'\n  expiration: '1 month'\n  remember_me: '1 month'\n  cookies:\n    - domain: 'kidibox.net'\n      authelia_url: 'https://auth.kidibox.net'\n  redis:\n    host: 'authelia-valkey'\n    port: 6379\n    database_index: 0\n    maximum_active_connections: 8\n    minimum_idle_connections: 0\nregulation:\n  modes:\n  - 'user'\n  max_retries: 3\n  find_time: '2 minutes'\n  ban_time: '5 minutes'\nstorage:\n  local:\n    path: '/config/db.sqlite3'\nnotifier:\n  disable_startup_check: true\n  smtp:\n    address: 'submission://smtp.gmail.com:587'\n    timeout: '5 seconds'\n    username: 'arnaud.rebts@gmail.com'\n    sender: 'Authelia <arnaud.rebts@gmail.com>'\n    identifier: 'localhost'\n    subject: '[Authelia] {title}'\n    startup_check_address: 'test@authelia.com'\n    disable_html_emails: false\n    disable_require_tls: false\n    disable_starttls: false\n    tls:\n      server_name: ''\n      skip_verify: false\n      minimum_version: 'TLS1.2'\n      maximum_version: 'TLS1.3'\nidentity_providers:\n  oidc:\n    lifespans:\n      access_token: '1 hour'\n      refresh_token: '30 days'\n      id_token: '1 hour'\n      authorize_code: '1 minute'\n      device_code: '10 minutes'\n      jwt_secured_authorization: '5 minutes'\n    enforce_pkce: 'public_clients_only'\n    enable_pkce_plain_challenge: false\n    enable_client_debug_messages: false\n    enable_jwt_access_token_stateless_introspection: false\n    minimum_parameter_entropy: 8\n    discovery_signed_response_alg: ''\n    discovery_signed_response_key_id: ''\n    require_pushed_authorization_requests: false\n    claims_policies:\n      oidc-id-token:\n        id_token:\n        - 'groups'\n        - 'email'\n      