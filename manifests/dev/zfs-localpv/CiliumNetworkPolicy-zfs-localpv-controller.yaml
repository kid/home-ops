apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: zfs-localpv-controller
  namespace: zfs-localpv
spec:
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
  endpointSelector:
    matchLabels:
      name: openebs-zfs-controller
