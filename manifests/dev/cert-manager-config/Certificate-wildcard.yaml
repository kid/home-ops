apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard
  namespace: envoy-gateway-system
spec:
  dnsNames:
    - '*.dev.kidibox.net'
    - dev.kidibox.net
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-staging
  privateKey:
    algorithm: ECDSA
    rotationPolicy: Always
    size: 256
  secretName: wildcard-tls
