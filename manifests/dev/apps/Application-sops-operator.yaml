apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sops-operator
  namespace: argocd
spec:
  destination:
    namespace: sops-operator
    server: https://kubernetes.default.svc
  project: default
  source:
    path: ./manifests/dev/sops-operator
    repoURL: https://github.com/kid/home-ops.git
    targetRevision: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
      limit: 10
    syncOptions:
      - ServerSideApply=true
