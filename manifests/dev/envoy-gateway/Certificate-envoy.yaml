apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: envoy
  namespace: envoy-gateway-system
spec:
  dnsNames:
    - '*.envoy-gateway-system'
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: envoy-gateway-ca
  privateKey:
    algorithm: ECDSA
    size: 256
  secretName: envoy
