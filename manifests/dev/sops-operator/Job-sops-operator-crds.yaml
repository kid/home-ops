apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-1"
  labels:
    app.kubernetes.io/component: crd-install-hook
    app.kubernetes.io/instance: sops-operator
    app.kubernetes.io/name: sops-operator
  name: sops-operator-crds
  namespace: sops-operator
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        app.kubernetes.io/component: crd-install-hook
        app.kubernetes.io/instance: sops-operator
        app.kubernetes.io/name: sops-operator
      name: sops-operator-crds
    spec:
      containers:
        - command:
            - sh
            - -c
            - |
              set -o errexit ; set -o xtrace ; set -o nounset

              # piping stderr to stdout means kubectl's errors are surfaced
              # in the pod's logs.

              kubectl apply --server-side=true --overwrite=true --force-conflicts=true -f /data/ 2>&1
          image: docker.io/clastix/kubectl:v1.36
          imagePullPolicy: IfNotPresent
          name: crds-hook
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 1002
            runAsNonRoot: true
            runAsUser: 1002
          volumeMounts:
            - mountPath: /data/addons.projectcapsule.dev_globalsopssecrets.yaml
              name: globalsopssecrets
              subPath: addons.projectcapsule.dev_globalsopssecrets.yaml
            - mountPath: /data/addons.projectcapsule.dev_sopsproviders.yaml
              name: sopsproviders
              subPath: addons.projectcapsule.dev_sopsproviders.yaml
            - mountPath: /data/addons.projectcapsule.dev_sopssecrets.yaml
              name: sopssecrets
              subPath: addons.projectcapsule.dev_sopssecrets.yaml
      restartPolicy: Never
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: sops-operator-crds
      volumes:
        - configMap:
            items:
              - key: content
                path: addons.projectcapsule.dev_globalsopssecrets.yaml
            name: sops-operator-crds-globalsopssecrets
          name: globalsopssecrets
        - configMap:
            items:
              - key: content
                path: addons.projectcapsule.dev_sopsproviders.yaml
            name: sops-operator-crds-sopsproviders
          name: sopsproviders
        - configMap:
            items:
              - key: content
                path: addons.projectcapsule.dev_sopssecrets.yaml
            name: sops-operator-crds-sopssecrets
          name: sopssecrets
  ttlSecondsAfterFinished: 60
