apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: notification-controller
  namespace: flux-system
spec:
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
  endpointSelector:
    matchLabels:
      app: notification-controller
  ingress:
    - fromEndpoints:
        - matchLabels:
            app: source-controller
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app: kustomize-controller
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: cloudflare-tunnel-gateway-controller-proxy
            k8s:io.kubernetes.pod.namespace: cloudflare-tunnel-system
      toPorts:
        - ports:
            - port: "9292"
              protocol: TCP
